<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'unsafe-inline'; connect-src wss://api.x.ai; worker-src blob:; media-src blob:">
<title>LoreRelay Voice Companion</title><style>
:root{color-scheme:light dark;font:16px/1.6 system-ui}body{max-width:700px;margin:32px auto;padding:0 20px;background:Canvas;color:CanvasText}
h1{font-size:24px}label{display:block;margin:18px 0 6px}textarea,input[type=password]{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid GrayText;border-radius:6px}textarea{height:180px}
button{font:inherit;margin:18px 12px 0 0;padding:8px 20px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid Highlight;outline-offset:3px}#status{font-weight:bold}#transcript{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><h1>LoreRelay 音声相談役</h1>
<p>読取専用です。開始すると、マイク音声・公開ゲーム情報・一時読取tokenをxAIが処理します。取引・移動・日送りは実行しません。</p>
<label for="config">LoreRelayが発行したGrok Voice設定</label><textarea id="config" spellcheck="false" autocomplete="off"></textarea>
<label for="token">xAI Voiceの一時トークン（APIキーではありません）</label><input id="token" type="password" autocomplete="off">
<label><input id="consent" type="checkbox">上記の送信内容を確認し、音声接続を開始します。</label>
<button id="start" type="button">接続を開始</button><button id="stop" type="button" disabled>停止</button>
<p id="status" role="status">停止中。接続・録音はしていません。</p><p id="transcript" aria-live="polite"></p>
<p>この画面は認証情報や音声を保存しません。切断後の自動再接続は行いません。停止後はLoreRelay側の接続も停止してください。</p>
<script src="/voice-client.js"></script></body></html>
